name: Despliegue

# MC-65. Publica Convex, la sala y el juego en un entorno: `preview` (a mano o desde un pull request) o
# `production` (cada push a main). Las llaves salen de los entornos de GitHub (Settings → Environments → preview /
# production), nunca del código. Si falta una llave, ese paso se salta con un aviso y el flujo queda en verde:
# hasta que Luis cargue sus cuentas, esto no publica nada.
#
# Host del juego: variable de repositorio HOST_WEB = cloudflare | vercel. Vacía → no se publica el juego.
# Ver docs/ENTORNOS.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      entorno:
        description: Entorno
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: despliegue-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || inputs.entorno || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    name: desplegar (${{ github.event_name == 'pull_request' && 'preview' || inputs.entorno || 'production' }})
    # Los pull requests desde forks no tienen secretos: ni lo intentamos.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'pull_request' && 'preview' || inputs.entorno || 'production' }}
    env:
      ENTORNO: ${{ github.event_name == 'pull_request' && 'preview' || inputs.entorno || 'production' }}
      RAMA: ${{ github.head_ref || github.ref_name }}
      HOST_WEB: ${{ vars.HOST_WEB }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VITE_SALAS_URL: ${{ vars.VITE_SALAS_URL }}
      CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Qué falta
        run: |
          falta=0
          avisar() { echo "::notice title=Despliegue $ENTORNO::$1"; falta=1; }
          [ -n "$CONVEX_DEPLOY_KEY" ] || avisar "Falta el secreto CONVEX_DEPLOY_KEY: no se publica Convex."
          [ -n "$CLOUDFLARE_API_TOKEN" ] || avisar "Falta el secreto CLOUDFLARE_API_TOKEN: no se publica la sala."
          case "$HOST_WEB" in
            cloudflare) [ -n "$CLOUDFLARE_API_TOKEN" ] || avisar "HOST_WEB=cloudflare sin CLOUDFLARE_API_TOKEN." ;;
            vercel) [ -n "$VERCEL_TOKEN" ] || avisar "HOST_WEB=vercel sin el secreto VERCEL_TOKEN." ;;
            *) avisar "Variable HOST_WEB vacía (cloudflare o vercel): no se publica el juego." ;;
          esac
          [ -n "$VITE_SALAS_URL" ] || avisar "Falta la variable VITE_SALAS_URL: el juego sale sin sala en vivo."
          echo "falta=$falta" >> "$GITHUB_ENV"

      # La sala primero: Convex y el juego apuntan a ella. CONVEX_SITE_URL va como variable, SALA_SECRETO ya
      # vive en Cloudflare (`wrangler secret put SALA_SECRETO --env $ENTORNO`).
      - name: Sala (Cloudflare)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/salas
        run: |
          extra=()
          [ -n "$CONVEX_SITE_URL" ] && extra=(--var "CONVEX_SITE_URL:$CONVEX_SITE_URL")
          pnpm exec wrangler deploy --env "$ENTORNO" "${extra[@]}"

      # Convex compila el juego con su propia URL en VITE_CONVEX_URL. En preview, CONVEX_DEPLOY_KEY es una llave
      # de vista previa y crea un Convex por rama.
      - name: Convex y compilar el juego
        if: env.CONVEX_DEPLOY_KEY != ''
        run: |
          extra=()
          [ "$ENTORNO" = preview ] && extra=(--preview-name "$RAMA")
          npx convex deploy "${extra[@]}" \
            --cmd 'pnpm --filter @mundo-catrucho/web build:web' --cmd-url-env-var-name VITE_CONVEX_URL

      # Sin Convex el juego se compila igual, sin servidor (LocalNet, sin red).
      - name: Compilar el juego sin Convex
        if: env.CONVEX_DEPLOY_KEY == '' && env.HOST_WEB != ''
        run: pnpm --filter @mundo-catrucho/web build:web

      - name: Juego (Cloudflare)
        if: env.HOST_WEB == 'cloudflare' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm --filter @mundo-catrucho/salas exec wrangler deploy --config ../../apps/web/wrangler.toml --env "$ENTORNO"

      - name: Juego (Vercel)
        if: env.HOST_WEB == 'vercel' && env.VERCEL_TOKEN != ''
        working-directory: apps/web
        # Ya compilado: se sube tal cual con el formato «Build Output API» (Vercel no vuelve a compilar).
        run: |
          rm -rf .vercel/output && mkdir -p .vercel/output
          cp -r dist/web .vercel/output/static
          echo '{"version":3}' > .vercel/output/config.json
          prod=()
          [ "$ENTORNO" = production ] && prod=(--prod)
          npx --yes vercel@latest deploy --prebuilt "${prod[@]}" --token "$VERCEL_TOKEN" --yes
