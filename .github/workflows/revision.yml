name: Revisión

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: revision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revision:
    name: check, test y capturas
    runs-on: ubuntu-latest
    # la revisión completa ya tarda ~46 min sin GPU (19 nov): margen para que no corte por tiempo
    timeout-minutes: 80
    env:
      CHROME_BIN: google-chrome
      MC_GPU: "0"
      MC_LENTO: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @mundo-catrucho/web capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: |
            capturas/
            /tmp/mc-fail-*.png
          if-no-files-found: ignore
